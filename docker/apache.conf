# Sitio de Hampi. El puerto lo ajusta docker/entrypoint.sh según $PORT.
<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Archivos con huella (Vite), fuentes e íconos: caché larga.
    <LocationMatch "^/(build|fonts)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(images|icons)/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>
    <Files "sw.js">
        Header set Cache-Control "no-cache"
    </Files>

    AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json image/svg+xml application/manifest+json text/calendar
    AddType application/manifest+json .webmanifest

    ServerSignature Off
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

ServerTokens Prod
